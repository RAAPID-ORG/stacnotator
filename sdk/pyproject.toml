[project]
name = "stacnotator-sdk"
version = "0.1.0"
description = "Python SDK/CLI for active learning with STACNotator campaign labels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.0",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stacnotator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "T20"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["stacnotator"]
