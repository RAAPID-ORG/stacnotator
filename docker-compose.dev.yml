# Development Docker Compose Configuration (Standalone)
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database with PostGIS + pgvector
  db:
    build:
      context: ./db
    image: stacnotator-db:dev
    container_name: stacnotator-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stacnotator}
      POSTGRES_USER: ${POSTGRES_USER:-stacnotator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stacnotator} -d ${POSTGRES_DB:-stacnotator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stacnotator-dev-network

  # Backend API (Development with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBNAME: ${POSTGRES_DB:-stacnotator}
      DBUSER: ${POSTGRES_USER:-stacnotator}
      DBPASS: ${POSTGRES_PASSWORD:-devpassword}
      DBHOST: db
      DBPORT: 5432
      DBDRIVER: psycopg2
      DBSCHEME: postgresql
      AUTH_PROVIDER: ${AUTH_PROVIDER:-firebase}
      FIREBASE_CREDENTIALS_PATH: /app/config/firebase-credentials.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      EE_SERVICE_ACCOUNT: ${EE_SERVICE_ACCOUNT:-}
      EE_PRIVATE_KEY_PATH: /app/config/ee-private-key.json
      TILER_TOKEN_SECRET: ${TILER_TOKEN_SECRET:-dev-tiler-secret-change-in-production}
      ENVIRONMENT: development
      LOG_LEVEL: debug
      # No tiler runs locally by default, so the tiler registry is empty: only MPC
      # imagery with first-valid compositing works (served directly by MPC). To use
      # non-MPC catalogs or compositing/masking, run the tiler (see note below) and
      # uncomment these to register it (the URL must be reachable from this container):
      # TILERS: '{"hosted":{"url":"http://host.docker.internal:8000","allows_ingest":true}}'
      # DEFAULT_TILER: hosted
    volumes:
      # Mount source code for hot reloading
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic  # Writable for creating migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/logging.ini:/app/logging.ini:ro
      - ./backend/seed_dev_data.py:/app/seed_dev_data.py:ro
      - ./backend/logs:/app/logs
      # Tests (mounted so pytest runs inside the container)
      - ./backend/tests:/app/tests:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      # Mount credential files. Default to the tracked .gitkeep placeholder so
      # Docker doesn't auto-create root-owned directories when the host
      # path is missing (which breaks backend startup). When the corresponding
      # *_PATH_HOST env var is set, that real file is mounted instead.
      - ${FIREBASE_CREDENTIALS_PATH_HOST:-./backend/config/.gitkeep}:/app/config/firebase-credentials.json:ro
      - ${EE_PRIVATE_KEY_PATH_HOST:-./backend/config/.gitkeep}:/app/config/ee-private-key.json:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - stacnotator-dev-network
    # Override command for development with hot reload
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # No tiler service here. The tiler lives in its own repo
  # (https://github.com/RAAPID-ORG/stacnotator-tiler) and isn't needed for local
  # development: MPC imagery with first-valid compositing is served directly by
  # Microsoft Planetary Computer, so db + backend + frontend is enough.
  #
  # A tiler is only required for imagery from OUTSIDE MPC (custom STAC catalogs) or
  # for compositing/masking (median/mean/NDVI-best, SCL masks). To use those
  # locally, clone the tiler repo and `docker compose up` there (it brings up its
  # own pgstac + tiler on :8000), then set TILERS + DEFAULT_TILER on the backend
  # service above. Without that, the backend's tiler registry is empty and any
  # non-MPC / compositing imagery is rejected at imagery-setup time.

  # Frontend (Development with Vite HMR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    container_name: frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      # E2E test files - mounted so tests run without rebuilding the image
      - ./frontend/e2e:/app/e2e:ro
      - ./frontend/playwright.config.ts:/app/playwright.config.ts:ro
      # Named volume for node_modules -persists installed packages across restarts
      # To install new packages: make dev-frontend-npm PKG="package-name"
      # To fully reset:          make dev-rebuild-frontend
      - frontend_node_modules_dev:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - stacnotator-dev-network

volumes:
  postgres_data_dev:
    driver: local
  frontend_node_modules_dev:
    driver: local

networks:
  stacnotator-dev-network:
    driver: bridge
