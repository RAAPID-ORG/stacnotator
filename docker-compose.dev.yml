# Development Docker Compose Configuration (Standalone)
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database with PostGIS + pgvector
  db:
    build:
      context: ./db
    image: stacnotator-db:dev
    container_name: stacnotator-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stacnotator}
      POSTGRES_USER: ${POSTGRES_USER:-stacnotator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stacnotator} -d ${POSTGRES_DB:-stacnotator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stacnotator-dev-network

  # Backend API (Development with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBNAME: ${POSTGRES_DB:-stacnotator}
      DBUSER: ${POSTGRES_USER:-stacnotator}
      DBPASS: ${POSTGRES_PASSWORD:-devpassword}
      DBHOST: db
      DBPORT: 5432
      DBDRIVER: psycopg2
      DBSCHEME: postgresql
      AUTH_PROVIDER: ${AUTH_PROVIDER:-firebase}
      FIREBASE_CREDENTIALS_PATH: /app/config/firebase-credentials.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      EE_SERVICE_ACCOUNT: ${EE_SERVICE_ACCOUNT:-}
      EE_PRIVATE_KEY_PATH: /app/config/ee-private-key.json
      TILER_TOKEN_SECRET: ${TILER_TOKEN_SECRET:-dev-tiler-secret-change-in-production}
      ENVIRONMENT: development
      LOG_LEVEL: debug
      # Hosted-tiler registry. EMPTY by default -> no tiler, so only MPC imagery works
      # (served directly by MPC) and db+backend+frontend is enough. To use non-MPC catalogs,
      # compositing/masking, or custom-map COG overlays, run the tiler (note below) on
      # TILER_PORT=8083 and set these via env / a .env next to this file. `url` is what the
      # browser loads tiles from; `internal_url` is how this container reaches the tiler (via
      # the extra_hosts host-gateway alias). Example .env:
      #   TILERS={"hosted":{"url":"http://localhost:8083","internal_url":"http://host.docker.internal:8083","allows_ingest":true}}
      #   DEFAULT_TILER=hosted
      TILERS: ${TILERS:-}
      DEFAULT_TILER: ${DEFAULT_TILER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount source code for hot reloading
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic  # Writable for creating migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/logging.ini:/app/logging.ini:ro
      - ./backend/seed_dev_data.py:/app/seed_dev_data.py:ro
      - ./backend/logs:/app/logs
      # Tests (mounted so pytest runs inside the container)
      - ./backend/tests:/app/tests:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      # Mount credential files. Default to the tracked .gitkeep placeholder so
      # Docker doesn't auto-create root-owned directories when the host
      # path is missing (which breaks backend startup). When the corresponding
      # *_PATH_HOST env var is set, that real file is mounted instead.
      - ${FIREBASE_CREDENTIALS_PATH_HOST:-./backend/config/.gitkeep}:/app/config/firebase-credentials.json:ro
      - ${EE_PRIVATE_KEY_PATH_HOST:-./backend/config/.gitkeep}:/app/config/ee-private-key.json:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - stacnotator-dev-network
    # Override command for development with hot reload
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # --- Optional tiler (docker compose profile: "tiler") ---
  # OFF by default: a plain `docker compose up` is db + backend + frontend, and MPC imagery
  # is served directly by Microsoft, so no tiler is needed. Turn it on for non-MPC catalogs,
  # compositing/masking, or custom-map / prediction COG overlays by setting COMPOSE_PROFILES=tiler
  # (plus TILERS/DEFAULT_TILER pointing at it) in .env - then the same `docker compose up`
  # brings up the tiler + its own pgstac, wired to the backend. See .env.example.
  #
  # The image is built straight from the tiler's GitHub repo (main), so users who only cloned
  # this repo don't need to check the tiler out - Docker fetches + builds it. Override
  # TILER_CONTEXT with a local path to build your own checkout (e.g. ../stacnotator-tiler for
  # dev, ./stacnotator-tiler in CI). Requires BuildKit (default in modern Docker).
  tiler-db:
    image: ghcr.io/stac-utils/pgstac:v0.9.5
    profiles: ["tiler"]
    container_name: tiler-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgis
      PGUSER: postgres
      PGDATABASE: postgis
    volumes:
      - tiler_pgstac_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgis"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stacnotator-dev-network

  tiler:
    build:
      context: ${TILER_CONTEXT:-https://github.com/RAAPID-ORG/stacnotator-tiler.git#main}
    image: stacnotator-tiler:dev
    profiles: ["tiler"]
    container_name: tiler-dev
    restart: unless-stopped
    depends_on:
      tiler-db:
        condition: service_healthy
    environment:
      PGHOST: tiler-db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgis
      # Shared with the backend so it can mint tiler tokens this tiler accepts. Same default.
      TILER_TOKEN_SECRET: ${TILER_TOKEN_SECRET:-dev-tiler-secret-change-in-production}
      TOKEN_TTL: 3600
      # Browser fetches tiles cross-origin (app :5173 -> tiler :8083), so allow that origin.
      CORS_ORIGINS: ${TILER_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Off for local; disk/public/MPC COGs need no signing. See the tiler repo for Azure.
      AZURE_SIGNING_ENABLED: ${AZURE_SIGNING_ENABLED:-false}
      # Allow POST /ingest so non-MPC STAC-API mosaics can be registered locally.
      ALLOW_STAC_API_INGEST: ${ALLOW_STAC_API_INGEST:-true}
    # The tiler fetches overlay COGs itself, so it needs the same host alias the backend
    # has - lets it reach e.g. a `python3 -m http.server` on the host serving a prediction COG.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Serve custom COGs from disk: drop *.tif into $COG_DIR (default ./cogs) and register a
      # custom map with cog_url=/data/cogs/<file>.tif. Read-only.
      - ${COG_DIR:-./cogs}:/data/cogs:ro
    ports:
      - "${TILER_PORT:-8083}:8000"
    networks:
      - stacnotator-dev-network

  # Frontend (Development with Vite HMR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    container_name: frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      # E2E test files - mounted so tests run without rebuilding the image
      - ./frontend/e2e:/app/e2e:ro
      - ./frontend/playwright.config.ts:/app/playwright.config.ts:ro
      # Named volume for node_modules -persists installed packages across restarts
      # To install new packages: make dev-frontend-npm PKG="package-name"
      # To fully reset:          make dev-rebuild-frontend
      - frontend_node_modules_dev:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - stacnotator-dev-network

volumes:
  postgres_data_dev:
    driver: local
  frontend_node_modules_dev:
    driver: local
  # pgstac data for the optional tiler (profile: tiler)
  tiler_pgstac_data_dev:
    driver: local

networks:
  stacnotator-dev-network:
    driver: bridge
