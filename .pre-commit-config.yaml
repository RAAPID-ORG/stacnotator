repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # GitHub Actions: workflow security
  # The deploy workflow runs on a self-hosted runner with `secrets: inherit` and an
  # OIDC token, so a template-injection or an unpinned action is a credential leak.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.10.0
    hooks:
      - id: zizmor

  # Backend + SDK: Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      # src + tests of both packages. Not sdk/examples: the demo notebooks are
      # prose, and rewriting them on every commit is churn with nothing to catch.
      - id: ruff
        args: ["--fix"]
        files: ^(backend|sdk)/(src|tests)/
      - id: ruff-format
        files: ^(backend|sdk)/(src|tests)/

  # Frontend: TypeScript
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint src/'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: tsc-frontend
        name: tsc --noEmit (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "src/**/*.{ts,tsx,css}"'
        language: system
        files: ^frontend/src/.*\.(ts|tsx|css)$
        pass_filenames: false
