[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stacnotator-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rasterio>=1.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary",
    "pydantic-settings>=2.0.0",
    "azure-storage-blob>=12.0.0",
    "azure-identity>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
