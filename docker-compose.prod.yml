# Production Docker Compose Configuration
# Usage: docker compose -f docker-compose.prod.yml up

services:
  # PostgreSQL Database with PostGIS + pgvector
  db:
    build:
      context: ./db
    image: stacnotator-db:latest
    container_name: stacnotator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stacnotator}
      POSTGRES_USER: ${POSTGRES_USER:-stacnotator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stacnotator} -d ${POSTGRES_DB:-stacnotator}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stacnotator-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBNAME: ${POSTGRES_DB:-stacnotator}
      DBUSER: ${POSTGRES_USER:-stacnotator}
      DBPASS: ${POSTGRES_PASSWORD:?Database password required}
      DBHOST: db
      DBPORT: 5432
      DBDRIVER: psycopg2
      DBSCHEME: postgresql
      # "production" arms the startup guard that rejects dev-default secrets.
      ENVIRONMENT: production
      AUTH_PROVIDER: firebase
      FIREBASE_CREDENTIALS_PATH: /app/config/firebase-credentials.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      EE_SERVICE_ACCOUNT: ${EE_SERVICE_ACCOUNT:-}
      EE_PRIVATE_KEY_PATH: /app/config/ee-private-key.json
      TILER_TOKEN_SECRET: ${TILER_TOKEN_SECRET:?Tiler token secret required}
      # Encrypts stored provider API keys at rest (base64 of 32 bytes, e.g. `openssl rand -base64 32`).
      APIKEY_ENCRYPTION_SECRET: ${APIKEY_ENCRYPTION_SECRET:?API key encryption secret required}
      TILERS: ${TILERS:-}
      DEFAULT_TILER: ${DEFAULT_TILER:-}
      TILER_COOKIE_DOMAIN: ${TILER_COOKIE_DOMAIN:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      # Gunicorn settings
      WORKERS: ${WORKERS:-1}
      TIMEOUT: ${TIMEOUT:-60}
      GRACEFUL_TIMEOUT: ${GRACEFUL_TIMEOUT:-30}
      KEEPALIVE: ${KEEPALIVE:-5}
      MAX_REQUESTS: ${MAX_REQUESTS:-50000}
      MAX_REQUESTS_JITTER: ${MAX_REQUESTS_JITTER:-5000}
    volumes:
      - ./backend/logs:/app/logs
      - ${FIREBASE_CREDENTIALS_PATH_HOST:?Firebase credentials file required}:/app/config/firebase-credentials.json:ro
      - ${EE_PRIVATE_KEY_PATH_HOST:-./backend/config/.gitkeep}:/app/config/ee-private-key.json:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - stacnotator-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # No tiler service - it lives in its own repo
  # (https://github.com/RAAPID-ORG/stacnotator-tiler) and is deployed separately.
  # MPC imagery is served directly by Planetary Computer; a tiler is only needed
  # for non-MPC catalogs or compositing/masking (set TILERS/DEFAULT_TILER above).

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_PROD:-}
        VITE_AUTH_MODE: firebase
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    networks:
      - stacnotator-network

volumes:
  postgres_data:
    driver: local

networks:
  stacnotator-network:
    driver: bridge
