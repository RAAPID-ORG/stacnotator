[loggers]
keys=root,httpx,httpcore

[handlers]
keys=console

[formatters]
keys=simple

[logger_root]
level=INFO
handlers=console

# httpx logs every request line at INFO, full URL included. Provider tile URLs carry
# the decrypted API key in a query param, so that would put keys in the log stream.
[logger_httpx]
level=WARNING
handlers=console
qualname=httpx
propagate=0

[logger_httpcore]
level=WARNING
handlers=console
qualname=httpcore
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

# SafeFormatter flattens newlines in the message so a user-supplied value (a catalog
# URL, a collection id, upstream error text) cannot forge a second log record.
# Tracebacks are appended after formatMessage and keep their line breaks.
[formatter_simple]
class=src.logging_safe.SafeFormatter
format=%(asctime)s | %(levelname)s | %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
