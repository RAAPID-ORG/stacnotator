<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title description">
  <title id="title">STACNotator</title>
  <desc id="description">The application's stacked-layer logo and wordmark beside real Sentinel-2 imagery of irrigated farmland near Garden City, Kansas.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1600" height="460" rx="20"/>
    </clipPath>
    <linearGradient id="fade">
      <stop offset="0" stop-color="#f7f6f5"/>
      <stop offset="0.2" stop-color="#f7f6f5" stop-opacity="0.96"/>
      <stop offset="0.4" stop-color="#f7f6f5" stop-opacity="0.78"/>
      <stop offset="0.6" stop-color="#f7f6f5" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="#f7f6f5" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#f7f6f5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="460" rx="20" fill="#f7f6f5"/>
  <g clip-path="url(#frame)">
    <image href="sentinel-kansas.jpg" x="760" y="0" width="840" height="460" preserveAspectRatio="xMidYMid slice"/>
    <rect x="760" width="480" height="460" fill="url(#fade)"/>
  </g>
  <g transform="translate(46 126) scale(6)">
    <rect x="4" y="12" width="14" height="14" rx="1.8" fill="#83bba6"/>
    <rect x="7" y="9" width="14" height="14" rx="1.8" fill="#41785d"/>
    <rect x="10" y="6" width="14" height="14" rx="1.8" fill="#274d38"/>
    <circle cx="20" cy="10" r="2" fill="#fff"/>
  </g>
  <text x="244" y="230" fill="#274d38" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="80" font-weight="600" letter-spacing="-3">STACNotator</text>
  <text x="248" y="284" fill="#4d4b49" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28">Satellite imagery annotation</text>
</svg>
