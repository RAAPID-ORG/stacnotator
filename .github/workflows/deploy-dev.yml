name: Deploy Dev

# Manual-only deploy of code to the dev Azure environment (backend, tiler, frontend).
# It does NOT touch any database, dev or prod.
#
# Prod credentials are intentionally absent: the dev OIDC identity has zero prod
# RBAC, and no prod secrets are mirrored into the dev Key Vault. The only way to
# refresh dev data from prod is `make az-sync-prod-to-dev`, run manually from a
# developer laptop on VPN, where prod creds are read from the prod Key Vault at
# runtime and never leave it.
#
# Gating: workflow_dispatch only, restricted to `develop`, and the `dev` GitHub
# Environment requires reviewer approval.

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      deploy-env: dev
    secrets: inherit
